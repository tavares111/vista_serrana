<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora Água - Unidade</title>
  <style>
    body { font-family: Inter, system-ui, Arial; padding: 20px; background:#f7fafc; color:#0f172a; }
    .card { background:white; border-radius:12px; padding:18px; box-shadow:0 6px 20px rgba(2,6,23,0.08); max-width:860px; margin:0 auto; }
    h1 { font-size:20px; margin:0 0 12px; }
    label { display:block; font-size:13px; margin-top:10px; color:#334155; }
    input[type=number] { width:160px; padding:8px 10px; border:1px solid #e2e8f0; border-radius:8px; margin-top:6px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:8px; }
    .result { margin-top:18px; padding:12px; border-radius:10px; background:#f1f5f9; }
    .big { font-weight:700; font-size:18px; }
    .muted { color:#64748b; font-size:13px; }
    button { margin-top:14px; padding:10px 14px; border-radius:10px; border:0; background:#0ea5a4; color:white; cursor:pointer; display:none; }
    small { color:#475569; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    @media (max-width:640px){ .grid2{ grid-template-columns:1fr } input[type=number]{ width:100% } }
    hr { margin:12px 0; border:none; border-top:1px solid #e2e8f0 }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculadora - Consumo da Unidade</h1>
    <p class="muted">Mostra o valor que a unidade pagaria na tarifa mínima, o valor correto (faixa mínima ou progressiva) e o valor que a imobiliária está cobrando.</p>

    <label>Consumo total do condomínio (m³)
      <input id="totalVolume" type="number" min="0" step="0.01" value="810">
    </label>

    <div class="grid2">
      <div>
        <label>Tarifa mínima (R$/m³)
          <input id="tarifaMin" type="number" step="0.0001" value="4.3298">
        </label>
      </div>
      <div>
        <label>Tarifa cobrada pela imobiliária (R$/m³)
          <input id="tarifaFixo" type="number" step="0.0001" value="4.96">
        </label>
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>LIMITE da primeira faixa (m³)
          <input id="limiteFaixa" type="number" step="1" value="810">
        </label>
      </div>
      <div>
        <label>Tarifa excedente (R$/m³)
          <input id="tarifaExcedente" type="number" step="0.0001" value="10.9126">
        </label>
      </div>
    </div>

    <label>Tarifa até o limite (R$/m³)
      <input id="tarifaFaixa" type="number" step="0.0001" value="4.9603">
    </label>

    <label>Consumo da unidade (m³)
      <input id="consumoUnidade" type="number" min="0" step="0.01" value="13">
    </label>

    <div class="row">
      <button id="btnCalc">Calcular</button>
    </div>

    <div id="results" class="result" aria-live="polite"></div>
  </div>

  <script>
    function fmtBRL(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

    function calcAll(){
      const total = parseFloat(document.getElementById('totalVolume').value)||0;
      const consumoUn = parseFloat(document.getElementById('consumoUnidade').value)||0;
      const tarifaMin = parseFloat(document.getElementById('tarifaMin').value)||0;
      const tarifaFixo = parseFloat(document.getElementById('tarifaFixo').value)||0;
      const limite = parseFloat(document.getElementById('limiteFaixa').value)||810;
      const tarifaFaixa = parseFloat(document.getElementById('tarifaFaixa').value)||0;
      const tarifaExc = parseFloat(document.getElementById('tarifaExcedente').value)||0;

      const prop = total > 0 ? consumoUn/total : 0;

      // 1. Valor da unidade na faixa mínima
      const valorMin = consumoUn * tarifaMin;

      // 2. Valor correto da unidade
      let valorCorreto = 0;
      if(total <= limite){
        valorCorreto = consumoUn * tarifaMin;
      } else {
        // calcular proporção da unidade sobre limite e excedente
        const volFaixa = Math.min(total, limite);
        const volExc = Math.max(0, total - limite);
        const propFaixa = volFaixa / total;
        const propExc = volExc / total;
        valorCorreto = consumoUn * (propFaixa * tarifaFaixa + propExc * tarifaExc);
      }

      // 3. Valor pago atualmente pela imobiliária
      const valorPago = consumoUn * tarifaFixo;

      // Comparativo
      const dif = valorPago - valorCorreto;
      const comparativo = dif > 0 
        ? `A imobiliária está cobrando ${fmtBRL(dif)} a mais do que o valor correto para esta unidade.`
        : dif < 0 
          ? `A imobiliária está cobrando ${fmtBRL(Math.abs(dif))} a menos do que o valor correto para esta unidade.`
          : `A imobiliária está cobrando exatamente o valor correto para esta unidade.`;

      document.getElementById('results').innerHTML = `
        <div><span class="muted">1) Valor na faixa mínima (unidade):</span></div>
        <div class="big">${fmtBRL(valorMin)}</div>
        <hr>
        <div><span class="muted">2) Valor correto (unidade):</span></div>
        <div class="big">${fmtBRL(valorCorreto)}</div>
        <hr>
        <div><span class="muted">3) Valor pago atualmente (unidade):</span></div>
        <div class="big">${fmtBRL(valorPago)}</div>
        <hr>
        <div><strong>${comparativo}</strong></div>
      `;
    }

    document.getElementById('btnCalc').addEventListener('click', calcAll);
    ['totalVolume','tarifaMin','tarifaFixo','limiteFaixa','tarifaFaixa','tarifaExcedente','consumoUnidade']
      .forEach(id=>document.getElementById(id).addEventListener('input', calcAll));
    calcAll();
  </script>
</body>
</html>
